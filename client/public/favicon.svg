<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient matching Project Theme (--bg-darker #0a0a0a to #18181b) -->
    <linearGradient id="themeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#0f0f11" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Border Gradient matching Project Theme (--border-color #2d2d2d) -->
    <linearGradient id="themeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52525b" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#3f3f46" />
    </linearGradient>

    <!-- Glyph Gradient matching --accent-primary (#f4f4f5 / #ffffff) -->
    <linearGradient id="glyphWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e4e4e7" />
    </linearGradient>

    <!-- Slash Gradient matching --text-muted (#a3a3a3 / #737373) -->
    <linearGradient id="glyphMuted" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e4e4e7" />
      <stop offset="100%" stop-color="#a1a1aa" />
    </linearGradient>

    <!-- Subtle Radial Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Squircle -->
  <rect x="20" y="20" width="472" height="472" rx="120" fill="url(#themeBg)" stroke="url(#themeBorder)" stroke-width="14" />

  <!-- Subtle Radial Inner Highlight -->
  <circle cx="256" cy="256" r="180" fill="url(#ambientGlow)" />

  <!-- Left Code Bracket (<) -->
  <path
    d="M 212 152
       L 126 238
       A 25 25 0 0 0 126 274
       L 212 360"
    fill="none"
    stroke="url(#glyphWhite)"
    stroke-width="40"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Right Code Bracket (>) -->
  <path
    d="M 300 152
       L 386 238
       A 25 25 0 0 1 386 274
       L 300 360"
    fill="none"
    stroke="url(#glyphWhite)"
    stroke-width="40"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Center Forward Slash (/) -->
  <path
    d="M 292 138
       L 220 374"
    fill="none"
    stroke="url(#glyphMuted)"
    stroke-width="36"
    stroke-linecap="round"
  />

  <!-- Real-time Connected Sync Indicator Dot in Theme Sage Accent (--color-success #84a59d) -->
  <circle cx="392" cy="124" r="24" fill="#84a59d" />
  <circle cx="392" cy="124" r="11" fill="#ffffff" />
</svg>